name: GSPL AI Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Verify GSPL canon dependency
        run: node scripts/verify-canon-deps.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run unit & integration tests
        run: npx vitest run --exclude 'tests/e2e/**' --exclude 'tests/security/**'

      - name: Run E2E success scenario
        run: npx vitest run tests/e2e/first-cognitive-execution.test.ts

      - name: Run E2E failure/rollback scenario
        run: npx vitest run tests/e2e/failure-rollback.test.ts

      - name: Run security E2E tests
        run: npx vitest run tests/security/coordinator-security.test.ts

      - name: Check package boundaries
        run: node scripts/check-package-boundaries.mjs

      - name: Verify clean working tree
        run: git diff --exit-code

  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all security tests
        run: |
          npx vitest run tests/security/coordinator-security.test.ts
          npx vitest run --dir packages/capability-security
