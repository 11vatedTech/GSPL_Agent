name: GSPL AI Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Verify GSPL canon dependency
        run: node scripts/verify-canon-deps.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run unit tests
        run: npx vitest run

      - name: Run E2E tests
        run: npx vitest run tests/e2e-scenarios.test.ts --config vitest.config.ts

      - name: Check package boundaries
        run: |
          # Verify no AI package depends on more than 2 canon packages
          echo "Package boundary check: $(ls packages/ | wc -l) AI packages"
          echo "Canon deps: canon-foundation, gene-protocol (via submodule)"

  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: |
          npx vitest run --dir packages/capability-security
          npx vitest run tests/e2e-scenarios.test.ts
